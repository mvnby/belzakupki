[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "belzakupki"
version = "0.1.0"
description = "BelZakupki tender monitoring service (FastAPI + RQ + PostgreSQL + Redis)"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "httpx",
  "beautifulsoup4",
  "lxml",
  "pydantic",
  "sqlalchemy",
  "psycopg[binary]",
  "alembic",
  "redis",
  "rq",
  "python-dotenv",
  "loguru",
  "pypdf",
  "python-docx",
  # Sprint 3: quality & robustness
  "pymorphy3",     # Russian morphological analysis for keyword scoring
  "tenacity",      # Retry with exponential backoff for DeepSeek API calls
  "openpyxl",      # .xlsx attachment extraction
  # Sprint 5: Reliability & OCR
  "xlrd",          # .xls attachment extraction
  "pytesseract",   # Tesseract OCR wrapper
  "pymupdf",       # PDF parsing & rendering for OCR (fitz)
  "py7zr",         # .7z archive extraction
  "rarfile",       # .rar archive extraction
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/worker/src"]
addopts = "-v --tb=short"

[project.scripts]
belzakupki-seed = "worker.cli:seed"
belzakupki-ingest-goszakupki = "worker.cli:ingest_goszakupki"
belzakupki-ingest-icetrade = "worker.cli:ingest_icetrade"
belzakupki-list-tenders = "worker.cli:show_tenders"
belzakupki-list-matches = "worker.cli:show_matches"
belzakupki-send-notifications = "worker.cli:send_notifications"


[tool.setuptools.packages.find]
where = ["packages/db", "apps/worker/src"]
