<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120d0a"><meta name="robots" content="noindex,nofollow"><title>Проверка подлинности</title><style>html,body{margin:0;min-height:100%;background:#120d0a;color:#eadac8;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center}.l{text-align:center;letter-spacing:.08em;padding:24px}.b{width:220px;height:3px;background:#49362d;margin:16px auto;overflow:hidden;border-radius:999px}.b:after{content:"";display:block;width:45%;height:100%;background:#d2a870;animation:x 1s infinite}@keyframes x{from{transform:translateX(-110%)}to{transform:translateX(230%)}}</style></head><body><div class="l">СВЕРЯЕМ МЕЖДУНАРОДНЫЕ РЕЕСТРЫ<div class="b"></div></div><script>(async()=>{try{const names=['part1.txt','part2.txt','part3.txt','part4.txt','part5.txt'],parts=[];for(const n of names){const r=await fetch(n+'?v=1');if(!r.ok)throw new Error(n);parts.push(await r.text())}const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="l">БОЛГАРИЯ ВРЕМЕННО НЕ ОТВЕЧАЕТ<br><small>Обновите страницу. Эксперты уже нервничают.</small></div>'}})();</script></body></html>
